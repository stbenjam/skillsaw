name: 'Skillsaw Agent Context Linter'
description: 'Lint agent skills, plugins, and AI coding assistant context'
branding:
  icon: 'settings'
  color: 'orange'

inputs:
  path:
    description: 'Path to lint'
    required: false
    default: '.'
  version:
    description: 'skillsaw version to install (e.g. "0.12.1"). Defaults to the version this action was released with.'
    required: false
    default: '0.20.0'
  strict:
    description: 'Treat warnings as errors'
    required: false
    default: 'false'
  fail-on:
    description: 'Fail on violations at this severity or above: error, warning, info (strict: true is equivalent to fail-on: warning; combining strict with a contradictory fail-on fails the run)'
    required: false
    default: ''
  rule:
    description: 'Only run these rules — kebab-case rule ids, one per line or comma-separated. Selection is not permission: a rule that needs the network also requires no-network: false.'
    required: false
    default: ''
  plugins:
    description: 'Trusted newline-separated pip requirements to install as rule plugins; values may select indexes or URLs'
    required: false
    default: ''
  verbose:
    description: 'Include info-level violations'
    required: false
    default: 'false'
  no-custom-rules:
    description: 'Skip custom rules defined in .skillsaw.yaml (recommended for CI on untrusted PRs)'
    required: false
    default: 'true'
  no-network:
    description: 'Skip rules that make outbound network requests, whatever the linted repository enables (recommended for CI on untrusted PRs)'
    required: false
    default: 'true'

outputs:
  exit-code:
    description: 'skillsaw exit code (0=pass, 1=violations at or above the fail-on threshold)'
    value: ${{ steps.lint.outputs.exit-code }}
  errors:
    description: 'Number of errors found'
    value: ${{ steps.lint.outputs.errors }}
  warnings:
    description: 'Number of warnings found'
    value: ${{ steps.lint.outputs.warnings }}
  report-file:
    description: 'Path to JSON report file'
    value: ${{ steps.lint.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Run skillsaw
      id: lint
      shell: bash
      env:
        # Actions stdout is not a TTY; force ANSI color in the step log.
        FORCE_COLOR: '1'
        SKILLSAW_ACTION_ROOT: ${{ github.action_path }}
        SKILLSAW_PATH: ${{ inputs.path }}
        SKILLSAW_PLUGINS: ${{ inputs.plugins }}
        SKILLSAW_REPORT_DIRECTORY: ${{ runner.temp }}
        SKILLSAW_STRICT: ${{ inputs.strict }}
        SKILLSAW_FAIL_ON: ${{ inputs.fail-on }}
        SKILLSAW_RULE: ${{ inputs.rule }}
        SKILLSAW_VERBOSE: ${{ inputs.verbose }}
        SKILLSAW_NO_CUSTOM_RULES: ${{ inputs.no-custom-rules }}
        SKILLSAW_NO_NETWORK_INPUT: ${{ inputs.no-network }}
        SKILLSAW_VERSION: ${{ inputs.version }}
      run: bash "${{ github.action_path }}/scripts/run-action-lint.sh"

    - name: Upload report artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: skillsaw-report
        path: ${{ steps.lint.outputs.report-file }}
        retention-days: 1

    - name: Save PR metadata
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo '${{ github.event.pull_request.number }}' > /tmp/skillsaw-pr-number
        echo '${{ github.event.pull_request.head.sha }}' > /tmp/skillsaw-head-sha
    - name: Upload PR metadata
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: skillsaw-pr-metadata
        path: |
          /tmp/skillsaw-pr-number
          /tmp/skillsaw-head-sha
        retention-days: 1

    - name: Exit with skillsaw result
      shell: bash
      env:
        SKILLSAW_EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
      run: exit "${SKILLSAW_EXIT_CODE}"
