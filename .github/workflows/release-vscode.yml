name: Release VS Code extension

on:
  workflow_dispatch:
  push:
    tags: [vscode-v*]

permissions:
  contents: read

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'stbenjam/skillsaw' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify release source and version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node <<'JS'
          const { version } = require('./editors/vscode/package.json');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Use a stable extension version.');
          if (process.env.RELEASE_EVENT === 'push' && process.env.RELEASE_REF !== `vscode-v${version}`)
            throw new Error('Release tag must match the extension version.');
          JS
      - run: make venv VENV_EXTRAS=test
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - run: npm run lint && npm test
        working-directory: editors/vscode
      - run: xvfb-run -a npm run test:host
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillsaw-vscode-release
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=stbenjam.skillsaw
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skillsaw-vscode-release
          path: editors/vscode/dist
      - name: Publish the tested VSIX with Trusted Publishing
        run: npx --no-install vsce publish --oidc --packagePath dist/*.vsix
        working-directory: editors/vscode
