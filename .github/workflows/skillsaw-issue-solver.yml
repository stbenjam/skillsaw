name: Issue Solver

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: skillsaw-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required: claude-code-action exchanges a GitHub OIDC token for its
  # app token at startup. Without this the action aborts immediately.
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.activity.outputs.issues }}
    steps:
      - name: Get labeled issues with trusted content only
        id: activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get collaborators (trusted users)
          COLLABS=$(gh api "repos/${{ github.repository }}/collaborators" --jq '[.[].login]')
          echo "Collaborators: $COLLABS"

          # Get open issues labeled "agent" (label = collaborator sign-off)
          ISSUES=$(gh issue list -R "${{ github.repository }}" --state open --label agent \
            --json number,title,body,author,labels --jq '.')

          ISSUE_COUNT=$(echo "$ISSUES" | jq length)
          echo "Issues labeled agent: $ISSUE_COUNT"

          if [ "$ISSUE_COUNT" = "0" ]; then
            echo "issues=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For each issue, build a matrix entry with trusted comments
          MATRIX="[]"
          echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
            NUM=$(echo "$issue" | jq -r '.number')

            # Find when agent label was added
            LABEL_TIME=$(gh api "repos/${{ github.repository }}/issues/$NUM/events" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "agent")] | last | .created_at')

            if [ -z "$LABEL_TIME" ] || [ "$LABEL_TIME" = "null" ]; then
              echo "$issue" | jq '. + {label_added_at: "", trusted_comments: []}'
            else
              COMMENTS=$(gh api "repos/${{ github.repository }}/issues/$NUM/comments" \
                | jq --arg lt "$LABEL_TIME" --argjson collabs "$COLLABS" \
                '[.[] | select(
                  (.user.login as $u | $collabs | index($u))
                  or (.created_at <= $lt)
                ) | {user: .user.login, body, created_at}]')

              echo "$issue" | jq --arg lt "$LABEL_TIME" --argjson c "$COMMENTS" \
                '. + {label_added_at: $lt, trusted_comments: $c}'
            fi
          done | jq -s -c '.' > /tmp/issues-with-comments.json

          echo "Prepared issues with trusted comments:"
          cat /tmp/issues-with-comments.json | jq '[.[] | {number, title, comment_count: (.trusted_comments | length)}]'

          # Output matrix: one entry per issue with number, ultracode flag, and
          # the full issue JSON written to a file (matrix values have a 256KB limit
          # but are kept small here by passing only metadata).
          MATRIX=$(cat /tmp/issues-with-comments.json | jq -c '[.[] | {
            number: .number,
            ultracode: ([.labels[].name] | any(. == "ultracode"))
          }]')
          echo "issues=$MATRIX" >> "$GITHUB_OUTPUT"

          # Write each issue to its own file for the solve job to pick up
          cat /tmp/issues-with-comments.json | jq -c '.[]' | while read -r issue; do
            NUM=$(echo "$issue" | jq -r '.number')
            echo "$issue" > "/tmp/issue-${NUM}.json"
          done

      - name: Upload issue data
        if: steps.activity.outputs.issues != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-data
          path: /tmp/issue-*.json
          if-no-files-found: ignore
          retention-days: 1

  solve:
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        issue: ${{ fromJson(needs.discover.outputs.issues) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download issue data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: issue-data
          path: /tmp

      - uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          prompt: |
            Use the skillsaw-issue-solver skill. Follow every step in the skill.

            ## Issue to solve

            This issue includes only trusted content: collaborator comments (any
            time) and non-collaborator comments from before the label was added.
            Create an [Auto] PR for it. Skip if already addressed by an open PR.

            <issue>
            $(cat /tmp/issue-${{ matrix.issue.number }}.json)
            </issue>
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools Edit,Write,Read,Bash,WebFetch,WebSearch,Skill,Agent,Glob,Grep,TodoWrite,TodoRead,TaskCreate,TaskUpdate,TaskList,TaskGet,EnterWorktree,ExitWorktree
            --max-turns 200
            --model claude-opus-5
            ${{ matrix.issue.ultracode && '--effort ultracode' || '' }}

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-execution-log-issue-${{ matrix.issue.number }}-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 30
