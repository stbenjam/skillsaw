name: VS Code extension
on:
  push:
    branches: [main]
  # Pull requests run this only when they touch the VS Code extension; pushes to
  # main run it unconditionally, so CLI changes that break it still surface.
  pull_request:
    branches: [main]
    paths:
      - editors/vscode/**
      - examples/editor-onboarding/**
      - tests/fixtures/editor-slow-rule/**
      - .github/workflows/test-editor.yml
      - .github/workflows/release-vscode.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: make venv VENV_EXTRAS=test
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - run: npm run lint && npm test && npm run package
        working-directory: editors/vscode
      - run: xvfb-run -a npm run test:host
        working-directory: editors/vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillsaw-vscode
          path: editors/vscode/*.vsix
      # Some path fixtures intentionally use names that Windows rejects.
      - name: Bundle the sources needed by Windows CLI tests
        run: >-
          git archive --format=zip --output="$RUNNER_TEMP/skillsaw-windows-inputs.zip"
          HEAD pyproject.toml README.md LICENSE src editors/vscode
          examples/editor-onboarding tests/fixtures/editor-slow-rule
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillsaw-windows-inputs
          path: ${{ runner.temp }}/skillsaw-windows-inputs.zip
  windows-cli:
    runs-on: windows-latest
    needs: vscode
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skillsaw-windows-inputs
      - run: Expand-Archive skillsaw-windows-inputs.zip -DestinationPath .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the CLI with pip's Windows console launcher
        shell: pwsh
        run: |
          & "$env:pythonLocation/python.exe" -m venv .venv
          .venv/Scripts/python.exe -m pip install .
          .venv/Scripts/python.exe -c "from pip._vendor import distlib; print('distlib launcher:', distlib.__version__)"
      - name: Test the installed CLI and interpreter cancellation
        run: node --test test/cli.test.js test/runner.test.js
        working-directory: editors/vscode
