name: Link check

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --user-agent 'Mozilla/5.0 (compatible; skillsaw-link-check/1.0; +https://github.com/stbenjam/skillsaw)'
            --exclude-path '(^|/)tests/fixtures/'
            --exclude-path '(^|/)src/skillsaw/marketplace/templates/'
            './**/*.md'
            './**/*.html'
            './**/*.rst'
          fail: false

      - name: Open broken-link issue
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Weekly broken-link report
          content-filepath: ./lychee/out.md
