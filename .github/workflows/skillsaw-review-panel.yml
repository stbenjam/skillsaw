name: Skillsaw Review Panel

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: panel-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required: claude-code-action exchanges a GitHub OIDC token for its
  # app token at startup. Without this the action aborts immediately.
  id-token: write

jobs:
  panel-review:
    if: github.event.label.name == 'panel-review'
    runs-on: ubuntu-latest
    steps:
      - name: Remove panel-review label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label panel-review --repo ${{ github.repository }} || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          prompt: |
            Use the skillsaw-review-panel skill. Follow every step in the skill.

            Review PR #${{ github.event.pull_request.number }}.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools Agent,Edit,Write,Read,Bash,WebFetch,WebSearch,Skill,Glob,Grep,TaskCreate,TaskUpdate,TaskList,TaskGet
            --model ${{ contains(github.event.pull_request.labels.*.name, 'fable-5') && 'claude-fable-5' || 'claude-opus-5' }}

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-review-log-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 30
