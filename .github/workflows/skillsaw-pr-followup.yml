name: PR Follow-up

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: skillsaw-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required: claude-code-action exchanges a GitHub OIDC token for its
  # app token at startup. Without this the action aborts immediately.
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.activity.outputs.prs }}
    steps:
      - name: Restore per-PR timestamps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pr-followup-since/
          key: pr-followup-since-${{ github.run_id }}
          restore-keys: pr-followup-since-

      - name: Get reviewable PRs and new activity
        id: activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .pr-followup-since

          # Get list of collaborators (trusted users only)
          COLLABS=$(gh api "repos/${{ github.repository }}/collaborators" --jq '[.[].login]')

          # Trusted bot accounts whose review comments should be processed
          TRUSTED_BOTS='["coderabbitai[bot]", "codecov[bot]", "github-actions[bot]", "devin-ai-integration[bot]", "chatgpt-codex-connector[bot]"]'

          # Merge collaborators + trusted bots into a single allow-list
          COLLABS=$(echo "$COLLABS" "$TRUSTED_BOTS" | jq -s 'add | unique')
          echo "Trusted users: $(echo "$COLLABS" | jq 'length') entries"

          # Open PRs with agent label
          PRS=$(gh pr list -R "${{ github.repository }}" --state open --label agent --json number,title,author,labels)

          if [ -z "$PRS" ] || [ "$PRS" = "[]" ]; then
            echo "No open PRs with agent label"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For each PR, fetch comments using that PR's own since timestamp
          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')

            # Per-PR since: use last-processed timestamp if available,
            # otherwise fetch all comments (no since cutoff)
            SINCE_FILE=".pr-followup-since/pr-${NUM}"
            SINCE_PARAM=""
            if [ -f "$SINCE_FILE" ]; then
              PR_SINCE=$(cat "$SINCE_FILE")
              SINCE_PARAM="&since=${PR_SINCE}"
              echo "PR #${NUM}: fetching comments since ${PR_SINCE}"
            else
              echo "PR #${NUM}: first time — fetching all comments"
            fi

            # Capture timestamp before fetching so comments posted during
            # the API calls are included in the next run's window
            NEXT_SINCE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

            # Fetch review comments for this PR (--slurp flattens paginated pages)
            PR_REVIEW_COMMENTS=$(gh api "repos/${{ github.repository }}/pulls/${NUM}/comments?per_page=100${SINCE_PARAM}" --paginate --slurp \
              | jq --argjson collabs "$COLLABS" \
              '[.[][] | select(.user.login as $u | $collabs | index($u)) | {id, user: .user.login, body: (.body // "" | gsub("(?s)<!--.*?-->"; "") | gsub("(?s)<!--.*"; "")), path, line, created_at}]')

            # Fetch PR-level comments for this PR
            PR_COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${NUM}/comments?per_page=100${SINCE_PARAM}" --paginate --slurp \
              | jq --argjson collabs "$COLLABS" \
              '[.[][] | select(.user.login as $u | $collabs | index($u)) | {id, user: .user.login, body: (.body // "" | gsub("(?s)<!--.*?-->"; "") | gsub("(?s)<!--.*"; "")), created_at}]')

            echo "$pr" | jq \
              --argjson rc "$PR_REVIEW_COMMENTS" \
              --argjson pc "$PR_COMMENTS" \
              '. + {review_comments: $rc, pr_comments: $pc}' \
              > "/tmp/pr-${NUM}.json"

            echo "  Review comments: $(echo "$PR_REVIEW_COMMENTS" | jq length), PR comments: $(echo "$PR_COMMENTS" | jq length)"

            # Persist pre-fetch timestamp for next run
            echo "$NEXT_SINCE" > "$SINCE_FILE"
          done

          # Build matrix
          MATRIX=$(echo "$PRS" | jq -c '[.[] | {
            number: .number,
            ultracode: ([.labels[].name] | any(. == "ultracode")),
            fable: ([.labels[].name] | any(. == "fable-5"))
          }]')
          echo "prs=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Open PRs with agent label:"
          echo "$PRS" | jq length

      - name: Upload PR data
        if: steps.activity.outputs.prs != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-data
          path: /tmp/pr-*.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Save per-PR timestamps
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pr-followup-since/
          key: pr-followup-since-${{ github.run_id }}

  follow-up:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pr: ${{ fromJson(needs.discover.outputs.prs) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download PR data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-data
          path: /tmp

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          prompt: |
            Use the skillsaw-pr-followup skill. Follow every step in the skill.

            IMPORTANT: Only review the following PR. Do NOT review any other PRs.

            <pr>
            $(cat /tmp/pr-${{ matrix.pr.number }}.json)
            </pr>

            <inline-review-comments>
            $(cat /tmp/pr-${{ matrix.pr.number }}.json | jq '.review_comments')
            </inline-review-comments>

            <pr-level-comments>
            $(cat /tmp/pr-${{ matrix.pr.number }}.json | jq '.pr_comments')
            </pr-level-comments>
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --dangerously-skip-permissions
            --model ${{ matrix.pr.fable && 'claude-fable-5' || 'claude-opus-5' }}
            ${{ matrix.pr.ultracode && '--effort ultracode' || '' }}

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-execution-log-pr-${{ matrix.pr.number }}-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 30
