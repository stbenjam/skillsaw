name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Integration steps clone and lint third-party repositories. Linting can
# execute repo-provided code (custom rules), so cap the token at read-only
# and never persist credentials into checkouts (see THREAT_MODEL.md T1/T9).
permissions:
  contents: read

# A newer push to the same PR supersedes any in-flight run. Pushes to main
# get a per-commit group so every one runs to completion — a shared group
# would let GitHub cancel the queued middle run of three rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # PRs run only the oldest supported version here — src/ has no
        # version-conditional code paths, and the newest (3.14) is exercised
        # by the coverage job on every run. Pushes to main run the rest.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.9"]') || fromJSON('["3.9", "3.10", "3.11", "3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: make venv VENV_EXTRAS=test

      - name: Run compatibility tests without coverage
        run: .venv/bin/pytest tests/ -v -n auto

  coverage:
    name: test (3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install package and dependencies
        run: make venv VENV_EXTRAS=test

      - name: Run tests with coverage
        run: make test-coverage VENV_EXTRAS=test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          use_oidc: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black>=26,<27" flake8

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  verify-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Install uv (for APM)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run make update
        run: make update

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "make update produced changes that were not committed:"
            git diff
            git status
            exit 1
          fi

      - name: Verify agent dirs match APM sources (injection/drift gate)
        # `make update` regenerates in place, so it cannot catch a file *injected*
        # into a managed agent dir (apm never deletes unmanaged files). This
        # non-destructive gate regenerates into a scratch dir and diffs, failing
        # on any injected/unmanaged or hand-edited file.
        run: make verify-apm

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Test --version
        run: skillsaw --version

      - name: Test list-rules
        run: skillsaw list-rules

      - name: Test init
        run: |
          cd /tmp
          skillsaw init
          test -f .skillsaw.yaml

      - name: Test claudelint shim
        run: |
          claudelint --version 2>&1 | grep -q "renamed"

      - name: Create test plugin and lint it
        run: |
          mkdir -p /tmp/test-plugin/.claude-plugin
          mkdir -p /tmp/test-plugin/commands

          # Create plugin.json
          cat > /tmp/test-plugin/.claude-plugin/plugin.json << 'EOF'
          {
            "name": "test-plugin",
            "description": "A test plugin",
            "version": "1.0.0",
            "author": {"name": "Test"}
          }
          EOF

          # Create command
          cat > /tmp/test-plugin/commands/test.md << 'EOF'
          ---
          description: Test command
          ---

          ## Name
          test-plugin:test

          ## Synopsis
          ```
          /test-plugin:test
          ```

          ## Description
          Test command

          ## Implementation
          Do something
          EOF

          # Lint it
          skillsaw /tmp/test-plugin

          # Should pass with no errors
          if [ $? -ne 0 ]; then
            echo "Linting failed!"
            exit 1
          fi

      - name: Test openshift-eng/ai-helpers
        run: |
          git clone --depth 1 https://github.com/openshift-eng/ai-helpers.git /tmp/ai-helpers

          # --no-custom-rules: never execute repo-provided Python from
          # third-party clones in CI (THREAT_MODEL.md T1). This also makes
          # ai-helpers' plugins-doc-up-to-date custom rule a non-issue.
          skillsaw --format json --no-custom-rules /tmp/ai-helpers | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['plugins'] > 0, 'no plugins scanned'
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          assert r['summary']['errors'] == 0, f\"unexpected errors: {r['summary']['errors']}\"
          # 'deprecated-rule' notices are advisory: they report that the linted
          # repo's own skillsaw config names a deprecated rule, and they never
          # affect skillsaw's exit code — so they must not fail this gate either.
          warns = [v for v in r['violations'] if v['severity'] == 'warning' and v['rule_id'] != 'deprecated-rule']
          assert not warns, f\"unexpected warnings: {[(v['rule_id'], v['message']) for v in warns]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, {r['stats']['rules_run']} rules\")
          "

      - name: Test official Agent Plugins v1 example
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pinned: upstream example changes should not make an unrelated
          # Skillsaw change fail. Bump deliberately after reviewing the diff.
          gh repo clone agentplugins/agent-plugins-example /tmp/agent-plugins-example -- --filter=blob:none
          git -C /tmp/agent-plugins-example checkout --quiet 5f3f5084a821aefa792e79500dd8f0462ab83473

          skillsaw lint --format json --no-custom-rules \
            --rule agent-plugin-json-valid \
            --rule agent-plugin-mcp-valid \
            /tmp/agent-plugins-example | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert 'agent-plugin' in r['stats']['repo_types'], f\"not detected as an Agent Plugin: {r['stats']['repo_types']}\"
          assert r['stats']['plugins'] == 1, f\"expected one plugin, scanned {r['stats']['plugins']}\"
          assert r['stats']['skills'] == 1, f\"expected one skill, scanned {r['stats']['skills']}\"
          assert r['stats']['rules_run'] == 2, f\"expected the 2 Agent Plugin rules, ran {r['stats']['rules_run']}\"
          assert r['violations'] == [], f\"Agent Plugin rules regressed: {[(v['rule_id'], v['message']) for v in r['violations'][:5]]}\"
          print('Official Agent Plugins v1 example: detected, one skill discovered, both rules clean')
          "

      - name: Test Automattic/build-with-wordpress (Devin rules gate)
        run: |
          # Pinned: upstream churn must not turn an unrelated Skillsaw change
          # red. Bump deliberately after reviewing its Devin corpus changes.
          git init --quiet /tmp/build-with-wordpress
          git -C /tmp/build-with-wordpress remote add origin https://github.com/Automattic/build-with-wordpress.git
          git -C /tmp/build-with-wordpress fetch --quiet --depth 1 origin b4fc8b710d1dd845c480771575c7f38f36c0f62c
          git -C /tmp/build-with-wordpress checkout --quiet FETCH_HEAD

          # This repo ships separate Devin CLI and Devin Desktop outputs. Keep
          # the gate scoped to Devin's two structural validators; unrelated
          # plugin and prose rules do not own this third-party corpus.
          python3 -c "
          from pathlib import Path
          from skillsaw.blocks import DevinRuleBlock, DevinSkillBlock
          from skillsaw.context import HAS_DEVIN, RepositoryContext
          context = RepositoryContext(Path('/tmp/build-with-wordpress'))
          assert HAS_DEVIN in context.detected_formats, 'Devin format not detected'
          assert len(context.lint_tree.find(DevinRuleBlock)) == 2, 'expected 2 Devin rules'
          assert len(context.lint_tree.find(DevinSkillBlock)) == 16, 'expected 16 Devin skills'
          "

          skillsaw lint --format json --no-custom-rules \
            --rule devin-rules-valid \
            --rule devin-skill-valid \
            /tmp/build-with-wordpress | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['rules_run'] == 2, f\"expected the 2 Devin rules, ran {r['stats']['rules_run']}\"
          assert r['violations'] == [], f\"Devin rules regressed: {[(v['rule_id'], v['message']) for v in r['violations'][:5]]}\"
          print('Automattic/build-with-wordpress: 2 rules, 16 skills, both Devin validators clean')
          "

      - name: Test auth0/agent-skills
        run: |
          git clone --depth 1 https://github.com/auth0/agent-skills.git /tmp/agent-skills

          skillsaw --format json --no-custom-rules /tmp/agent-skills | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          assert r['summary']['errors'] == 0, f\"unexpected errors: {r['summary']['errors']}\"
          # 'deprecated-rule' notices are advisory: they report that the linted
          # repo's own skillsaw config names a deprecated rule, and they never
          # affect skillsaw's exit code — so they must not fail this gate either.
          warns = [v for v in r['violations'] if v['severity'] == 'warning' and v['rule_id'] != 'deprecated-rule']
          assert not warns, f\"unexpected warnings: {[(v['rule_id'], v['message']) for v in warns]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, {r['stats']['rules_run']} rules\")
          "

      - name: Test opendatahub-io/agent-eval-harness
        run: |
          git clone --depth 1 https://github.com/opendatahub-io/agent-eval-harness.git /tmp/agent-eval-harness

          skillsaw --format json --no-custom-rules /tmp/agent-eval-harness | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          assert r['summary']['errors'] == 0, f\"unexpected errors: {r['summary']['errors']}\"
          # 'deprecated-rule' notices are advisory: they report that the linted
          # repo's own skillsaw config names a deprecated rule, and they never
          # affect skillsaw's exit code — so they must not fail this gate either.
          warns = [v for v in r['violations'] if v['severity'] == 'warning' and v['rule_id'] != 'deprecated-rule']
          assert not warns, f\"unexpected warnings: {[(v['rule_id'], v['message']) for v in warns]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, {r['stats']['rules_run']} rules\")
          "

      - name: Test kubernetes-sigs/maintainer-tools
        run: |
          git clone --depth 1 https://github.com/kubernetes-sigs/maintainer-tools.git /tmp/maintainer-tools

          skillsaw --format json --no-custom-rules /tmp/maintainer-tools | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          assert r['summary']['errors'] == 0, f\"unexpected errors: {r['summary']['errors']}\"
          # 'deprecated-rule' notices are advisory: they report that the linted
          # repo's own skillsaw config names a deprecated rule, and they never
          # affect skillsaw's exit code — so they must not fail this gate either.
          warns = [v for v in r['violations'] if v['severity'] == 'warning' and v['rule_id'] != 'deprecated-rule']
          assert not warns, f\"unexpected warnings: {[(v['rule_id'], v['message']) for v in warns]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, {r['stats']['rules_run']} rules\")
          "

      - name: Test RedHatProductSecurity/prodsec-skills
        run: |
          git clone --depth 1 https://github.com/RedHatProductSecurity/prodsec-skills.git /tmp/prodsec-skills

          skillsaw --format json --no-custom-rules /tmp/prodsec-skills | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          assert r['summary']['errors'] == 0, f\"unexpected errors: {r['summary']['errors']}\"
          # 'deprecated-rule' notices are advisory: they report that the linted
          # repo's own skillsaw config names a deprecated rule, and they never
          # affect skillsaw's exit code — so they must not fail this gate either.
          warns = [v for v in r['violations'] if v['severity'] == 'warning' and v['rule_id'] != 'deprecated-rule']
          assert not warns, f\"unexpected warnings: {[(v['rule_id'], v['message']) for v in warns]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, {r['stats']['rules_run']} rules\")
          "

      - name: Test openai/plugins (Codex rules gate)
        run: |
          # Pinned: an unrelated upstream commit must not turn main red
          # with a message blaming a rule change. Bump deliberately.
          git init --quiet /tmp/openai-plugins
          git -C /tmp/openai-plugins remote add origin https://github.com/openai/plugins.git
          git -C /tmp/openai-plugins fetch --quiet --depth 1 origin 11c74d6ba24d3a6d48f54a194cd00ef3beea18f9
          git -C /tmp/openai-plugins checkout --quiet FETCH_HEAD

          # The flagship Codex catalog (~180 plugins, ~580 skills). The five
          # codex-* rules are clean on it and must stay that way — a finding
          # here means a rule change regressed against the format's largest
          # real-world corpus. Scoped to the codex rules: the catalog's
          # third-party skill *content* is not ours to gate on.
          skillsaw --format json --no-custom-rules \
            --rule codex-plugin-json-valid \
            --rule codex-plugin-structure \
            --rule codex-marketplace-json-valid \
            --rule codex-marketplace-registration \
            --rule codex-openai-metadata \
            /tmp/openai-plugins | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          assert r['stats']['plugins'] > 0, 'no plugins scanned'
          assert 'codex-marketplace' in r['stats']['repo_types'], f\"not detected as a Codex marketplace: {r['stats']['repo_types']}\"
          assert r['stats']['rules_run'] == 5, f\"expected the 5 codex rules, ran {r['stats']['rules_run']}\"
          assert r['violations'] == [], f\"codex rules regressed: {[(v['rule_id'], v['message']) for v in r['violations'][:5]]}\"
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills — codex rules clean\")
          "

          # Full-run canary, not scoped to codex rules: Codex plugin prose
          # (commands/, agents/) must stay visible to the content and
          # security rules, and the gated Claude-format rules must stay
          # silent on Codex-only plugins. A --rule-scoped gate is blind to
          # both classes.
          skillsaw --format json --no-custom-rules /tmp/openai-plugins | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          vs = r['violations']
          prose = [v for v in vs if '/commands/' in v['file_path'] or '/agents/' in v['file_path']]
          assert prose, 'no findings under plugin commands/ or agents/ — Codex plugin prose has vanished from the lint tree'
          gated = ('claude-command-frontmatter', 'claude-command-naming', 'claude-command-name-format', 'claude-agent-frontmatter', 'claude-plugin-json-required', 'claude-plugin-naming')
          leaked = [v for v in vs if v['rule_id'] in gated]
          assert not leaked, f'Claude-format rules fired on Codex-only plugins: {[(v[\"rule_id\"], v[\"file_path\"]) for v in leaked[:5]]}'
          print(f'Full-run canary: {len(prose)} findings in plugin prose, 0 Claude-format leaks')
          "

      - name: Test jeremylongshore/claude-code-plugins-plus-skills (huge marketplace)
        run: |
          git clone --depth 1 https://github.com/jeremylongshore/claude-code-plugins-plus-skills.git /tmp/ccpps

          # ~445 plugins, ~3.6k skills, ~11.5k markdown files. This repo does
          # NOT need to lint clean — it guards against crashes and performance
          # regressions: before the broken-link walk cache and skill-nesting
          # fixes it took >3.5 minutes locally. It lints in ~56s on a runner,
          # so the 120s budget allows ~2x variance while failing on any real
          # slowdown.
          rc=0
          timeout 120 skillsaw --format json --no-custom-rules /tmp/ccpps > /tmp/ccpps.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "skillsaw crashed or blew the 120s budget (rc=$rc)"
            exit 1
          fi

          python3 -c "
          import json
          r = json.load(open('/tmp/ccpps.json'))
          assert r['stats']['plugins'] > 100, f\"expected hundreds of plugins, got {r['stats']['plugins']}\"
          assert r['stats']['skills'] > 1000, f\"expected thousands of skills, got {r['stats']['skills']}\"
          assert r['stats']['rules_run'] > 0, 'no rules ran'
          crashes = [v for v in r['violations'] if v['rule_id'] == 'rule-execution-error']
          assert not crashes, f'rules crashed: {crashes}'
          print(f\"Scanned {r['stats']['plugins']} plugins, {r['stats']['skills']} skills, \"
                f\"{len(r['violations'])} violations, {r['stats']['rules_run']} rules\")
          "

      - name: Test --output flag with multiple formats
        run: |
          # Reuses the /tmp/ai-helpers clone from the earlier step.
          skillsaw --no-custom-rules --output /tmp/report.json --output /tmp/report.sarif --output /tmp/report.html /tmp/ai-helpers

          python3 -c "
          import json, os

          for f in ['/tmp/report.json', '/tmp/report.sarif', '/tmp/report.html']:
              assert os.path.exists(f), f'{f} not created'
              assert os.path.getsize(f) > 0, f'{f} is empty'

          with open('/tmp/report.json') as f:
              data = json.load(f)
              assert 'stats' in data
              assert 'violations' in data

          with open('/tmp/report.sarif') as f:
              sarif = json.load(f)
              assert sarif['version'] == '2.1.0'
              assert len(sarif['runs']) == 1

          print('All output files validated successfully')
          "
