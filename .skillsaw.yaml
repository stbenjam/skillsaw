# skillsaw self-lint config
version: "99.0.0" # high version so all new rules get triggered

exclude:
  # apm build artifacts (gitignored) — the sources live in .apm/ and skills/
  - "apm_modules/*"
  # Agentic artifacts come from .apm, don't lint twice
  - "AGENTS.md"
  - ".claude/*"
  - ".cursor/*"
  - ".opencode/*"
  # Only .agents/skills/ is APM-compiled — .agents/plugins/marketplace.json is
  # our hand-authored Codex marketplace and must stay linted.
  - ".agents/skills/*"
  # `.github/instructions/*` and `.github/copilot-instructions.md` are not
  # listed: skillsaw recognises them as APM output on its own, and dead
  # config here would hide a regression in that guard.
  # Templates
  - "src/skillsaw/marketplace/templates/*"
  # Testing fixtures with intentional errors
  - "tests/fixtures/*"
  - "examples/plugins/skillsaw-example-plugin/tests/fixture/*"
  # Git worktrees (local only, not committed)
  - ".worktrees/*"
  - ".claude/worktrees/*"

# Additional markdown files to run content rules on (not agentic artifacts,
# so not auto-discovered) — dogfood the review guidelines against our own
# content-quality rules.
content-paths:
  - "REVIEW.md"

rules:
  # Terminology consistency is a cross-file signal for authored instructions.
  # Reference guidance and templates use domain vocabulary verbatim (skillsaw's
  # own "repo type" concept, placeholder tokens) — exclude them from the check.
  content-inconsistent-terminology:
    exclude:
      - "**/references/**"
      - "**/*template.md"
  # development.instructions.md carries genuinely dense cross-cutting
  # conventions (autofix invariants, ecosystem provenance, per-tool recipes)
  # that don't split cleanly across files without duplicating context every
  # rule author needs at once — raise the ceiling rather than fragment it.
  context-budget:
    limits:
      instruction:
        warn: 5250
  content-progressive-disclosure:
    limits:
      instruction: 5250
