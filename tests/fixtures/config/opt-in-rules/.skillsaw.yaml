version: "99.0.0"
rules:
  claude-command-sections:
    enabled: true
  claude-command-name-format:
    enabled: true
  mcp-prohibited:
    enabled: true
  agentskill-structure:
    enabled: true
  agentskill-evals-required:
    enabled: true
  promptfoo-assertions:
    enabled: true
    required-types:
      - cost
      - latency
  promptfoo-metadata:
    enabled: true
    required-keys:
      - token-usage
      - tier
  hooks-prohibited:
    enabled: true
  content-missing-stop-condition:
    enabled: true
  content-inline-tool-examples:
    enabled: true
